    <!-- Subtle Premium UX Animations & Reduced-Motion Accessibility Rules -->
    <style>
      /* Smooth transitions for interactive elements */
      button, a, input, select, textarea, .card, .product-card {
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      /* Keyboard focus indicators */
      :focus-visible {
        outline: 2px solid #b85d25 !important;
        outline-offset: 2px !important;
      }

      /* Hover elevation for cards and buttons */
      @media (hover: hover) {
        .product-card:hover, .card-hover:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 25px -5px rgba(184, 93, 37, 0.12);
        }
        button.primary-btn:hover, button.buy-now-btn:hover {
          transform: translateY(-1px);
        }
      }

      button:active, a:active {
        transform: scale(0.98);
      }

      /* Reduced Motion Accessibility Overrides */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
